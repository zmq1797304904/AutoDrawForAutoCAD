name: Build Windows Executable

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发版 tag（如 v1.0.4），仅在需创建 Release 时填写；留空则仅打包不发布'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.v }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 解析版本号：tag push 用 tag 名（如 v1.0.4）；手动触发用输入的 tag；
      # 两者都不是（手动触发且未填 tag）则用 dev
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            V="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            V="${{ github.ref_name }}"
          else
            V="dev"
          fi
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Create Executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.11'
          spec: 'AutoDraw.py'
          requirements: 'requirements.txt'
          options: --onefile, --name "AutoDraw", --windowed, --icon AutoDraw.ico, --add-data "AutoDraw.ico;.", --collect-all rapidocr, --collect-all onnxruntime, --hidden-import onnxruntime, --hidden-import onnxruntime.capi, --collect-submodules onnxruntime

      # 打包产物重命名加版本号：dist/AutoDraw.exe -> dist/AutoDraw_v1.0.4.exe
      - name: Rename exe with version
        shell: pwsh
        run: Copy-Item dist\AutoDraw.exe "dist\AutoDraw_${{ steps.ver.outputs.v }}.exe"

      # 不再使用 pyinstaller action 自带的 upload_exe_with_name，
      # 改为自己上传带版本号的产物（artifact 名与文件名都含版本号）
      - name: Upload versioned exe
        uses: actions/upload-artifact@v4
        with:
          name: AutoDraw_${{ steps.ver.outputs.v }}
          path: dist/AutoDraw_${{ steps.ver.outputs.v }}.exe

  release:
    needs: build
    # 仅在以下情况创建 Release：tag push 或 workflow_dispatch 且手动输入了 tag
    # 仅 push main 触发时不创建 Release（只验证打包是否成功）
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 按带版本号的 artifact 名下载，文件名已是 AutoDraw_<版本>.exe
      - name: Download built exe
        uses: actions/download-artifact@v4
        with:
          name: AutoDraw_${{ needs.build.outputs.version }}
          path: exe

      - name: Attach exe to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: exe/*.exe
          generate_release_notes: true
          # tag push 时 GITHUB_REF 自动是 tag；workflow_dispatch 时用 inputs.tag
          # 二者都有值，action 不会因缺少 tag 报错
          tag_name: ${{ inputs.tag || github.ref_name }}
