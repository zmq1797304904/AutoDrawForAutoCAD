name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.11'
          spec: 'AutoDraw.py'
          requirements: 'requirements.txt'
          upload_exe_with_name: 'AutoDraw'
          options: --onefile, --name "AutoDraw", --windowed, --collect-all rapidocr, --collect-all onnxruntime, --hidden-import onnxruntime, --hidden-import onnxruntime.capi, --collect-submodules onnxruntime

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built exe
        uses: actions/download-artifact@v4
        with:
          name: AutoDraw
          path: exe

      - name: Attach exe to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: exe/*.exe
          generate_release_notes: true
